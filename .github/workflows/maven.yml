name: CI integration maven

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 1.8
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 8.0.332+9
          cache: 'maven'

      - name: Maven Build and Coveralls
        run: |
          mvn -B install --file pom.xml
          mvn jacoco:report coveralls:report --define repoToken=${{ secrets.COVERALL_REPO_TOKEN }}